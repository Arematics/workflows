name: Setup Go Workflow

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      owner:
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned by commit SHA, with the tag kept as a
      # comment. A tag is movable; whoever controls it runs code in every
      # pipeline in this organisation, because this file is the setup step of
      # all of them (githubactions:S7637).
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: 1.23.2

      - name: Create GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.owner }}

      # $APP_TOKEN arrives through env rather than being interpolated into the
      # script. GitHub pastes ${{ ... }} into the shell source before the shell
      # starts, which can surface the token in `set -x` traces, process listings
      # and error output (githubactions:S7636).
      #
      # The EOF delimiter stays unquoted on purpose — quoting it would write the
      # literal text $APP_TOKEN into ~/.netrc and every private module fetch in
      # every repo would start failing to authenticate.
      - name: Configure auth for private GitHub modules (.netrc)
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          cat > ~/.netrc <<EOF
          machine github.com
            login x-access-token
            password ${APP_TOKEN}
          machine api.github.com
            login x-access-token
            password ${APP_TOKEN}
          EOF
          chmod 600 ~/.netrc

      - name: Configure Go for private modules
        run: |
          go env -w GOPRIVATE=github.com/Arematics/* 
          go env -w GONOSUMDB=github.com/Arematics/*

      - name: Initialize Go module cache
        run: |
          go mod download

      - name: Upload complete workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace
          path: ./
