name: Sonar Workflow

on:
  workflow_call:
    inputs:
      quality_gate_wait:
        # Off by default, and that default is the problem this input exists to
        # make visible rather than to hide.
        #
        # Without it the scanner uploads its report and exits 0. The job is then
        # green whatever the quality gate says — so a gate failing on coverage,
        # on a new vulnerability, on anything at all, appears nowhere in the
        # pipeline. Every repo using this workflow was in that state.
        #
        # It stays false here so that turning the gate into a blocker is a
        # deliberate, per-repo decision, taken when that repo's gate actually
        # passes, instead of one commit in this shared file turning six
        # pipelines red at once.
        description: "Fail the job when the SonarQube quality gate fails"
        type: boolean
        default: false
        required: false
    secrets:
      SONAR_TOKEN:
        description: "Sonar token for access to SonarCloud"
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download workspace artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-file
          path: ./coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.language=go
            -Dsonar.coverage.exclusions=**/tests/**,**/*_test.go
            -Dsonar.go.coverage.reportPaths=./coverage/cleaned-coverage.out
            -Dsonar.qualitygate.wait=${{ inputs.quality_gate_wait }}
