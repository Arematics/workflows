name: Release Library Workflow

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      previous_tag:
        description: 'Previous Tag (e.g., v1.0.0)'
        required: false
        type: string
      new_tag:
        description: 'New Tag (e.g., v1.0.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
          ref: master

      - name: Generate Release Notes
        id: generate_release_notes
        run: |
          echo "## What's Changed" > release_notes.md
          if [ -z "${{ inputs.previous_tag }}" ]; then
            git log --oneline --no-merges --decorate=short > release_notes.md
          else
            git log --oneline --no-merges --decorate=short ${{ inputs.previous_tag }}..HEAD >> release_notes.md
          fi
          cat release_notes.md

      # The commit the tag will actually point at, read from the checkout above.
      #
      # Without this, actions/create-release tags `github.sha` — the ref the run
      # was dispatched on, which for a workflow_dispatch is the repository's
      # DEFAULT branch. In go-service that is `develop`, so `ref: master` two
      # steps up was decoration: v0.10.0 landed on a merge commit from March and
      # shipped without the `migration` and `outbox` packages its consumers
      # import. A release that silently publishes a different tree than the one
      # it checked out is worse than no release workflow.
      - name: Resolve the commit being released
        id: released_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if tag is prerelease
        id: check_prerelease
        run: |
          if [[ "${{ inputs.new_tag }}" == *-beta* || "${{ inputs.new_tag }}" == *-alpha* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.new_tag }}
          release_name: Release ${{ inputs.new_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.prerelease }}
          commitish: ${{ steps.released_commit.outputs.sha }}